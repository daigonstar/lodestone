[package]
name = "lodestone-beacon-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lodestone Beacon client core: device identity, end-to-end encryption (MLS) and the server connection"

[dependencies]
openmls = "0.9.2"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_memory_storage = "0.6.0"
openmls_traits = "0.6.0"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# The server's live connection (events pushed as they happen). Same TLS stack and certificate checks as
# reqwest's; the WebSocket library is the one the server already uses.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rustls-platform-verifier = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
aes-gcm = "0.10"
sha2 = "0.10"
rusqlite = { version = "0.43", features = ["bundled"] }

[dev-dependencies]
lodestone-beacon-server = { path = "../server" }
tempfile = "3"
