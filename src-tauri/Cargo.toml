[package]
name = "lodestone"
version = "0.2.0"
description = "One launcher for every game library on Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/daigonstar/lodestone"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.43", features = ["bundled"] }
dirs = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha1 = "0.11"
sha2 = "0.11"
# RetroArch cores come as .zip files from libretro's build server; only plain (deflate) zips are needed.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
crc32fast = "1"
# RetroAchievements identifies ROMs by MD5 (same RustCrypto family as sha2).
md-5 = "0.11"
urlencoding = "2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same versions Tauri uses: to place the store browser over part of the window (see shop.rs).
gtk = "0.18"
webkit2gtk = "2.0"

[profile.release]
strip = true
lto = true
