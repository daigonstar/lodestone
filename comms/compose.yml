# Lodestone Comms with automatic HTTPS (Caddy). Works with `docker compose up -d` or `podman-compose up -d`.
# 1. Point a domain at this machine and open ports 80 and 443.
# 2. Set COMMS_DOMAIN below (or in a .env file next to this one).
# 3. Start it, then read the setup code once: `docker compose logs comms`.
services:
  comms:
    build: .
    restart: unless-stopped
    environment:
      COMMS_PUBLIC_URL: https://${COMMS_DOMAIN:?set COMMS_DOMAIN to your domain}
      # COMMS_ADMIN_ONLY_SPACES: "true"   # only host admins may create servers
    volumes:
      - comms-data:/data
    expose:
      - "8080"

  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${COMMS_DOMAIN} --to comms:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - comms

volumes:
  comms-data:
  caddy-data:
