[package]
name = "lodestone-comms-media"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lodestone Comms media: audio and screen capture through GStreamer and the desktop portals (phase 1 checks)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lodestone-comms-mediacheck"
path = "src/main.rs"

[dependencies]
gstreamer = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
str0m = "0.25"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
serde_json = "1"
gstreamer-app = "0.25"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
lodestone-comms-server = { path = "../server" }
lodestone-comms-client = { path = "../client" }
tempfile = "3"

# The desktop's portals (screen sharing, camera): Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast", "camera"] }

# Listing monitors and windows to share on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
