[package]
name = "lodestone-comms-media"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lodestone Comms media: audio and screen capture through GStreamer and the desktop portals (phase 1 checks)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lodestone-comms-mediacheck"
path = "src/main.rs"

[dependencies]
gstreamer = "0.25"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
str0m = "0.25"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
lodestone-comms-server = { path = "../server" }
lodestone-comms-client = { path = "../client" }
tempfile = "3"
