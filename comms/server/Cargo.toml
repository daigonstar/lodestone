[package]
name = "lodestone-comms-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Self-hosted server for Lodestone Comms: relays and stores end-to-end encrypted messages"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
str0m = "0.25"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
