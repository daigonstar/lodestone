<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lodestone Comms</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="layout">
    <nav class="servers" id="servers" aria-label="Servers"></nav>
    <aside class="channels" id="channels" aria-label="Channels"></aside>
    <main class="chat" id="chat"></main>
    <aside class="members" id="members" aria-label="Members"></aside>
    <section class="stage hidden" id="stage" aria-label="Screen shares"></section>
  </div>

  <dialog id="dlg">
    <form method="dialog" id="dlg-form">
      <h2 id="dlg-title"></h2>
      <div id="dlg-body"></div>
      <p class="err" id="dlg-err"></p>
      <div class="row end">
        <button type="button" class="ghost" id="dlg-cancel">Cancel</button>
        <button type="submit" class="primary" id="dlg-ok">OK</button>
      </div>
    </form>
  </dialog>
  <dialog id="settings" class="wide">
    <div class="set-head"><h2 id="set-title">Server settings</h2><button type="button" class="ghost" id="set-close">Close</button></div>
    <nav class="tabs" id="set-tabs"></nav>
    <div id="set-body" class="set-body"></div>
  </dialog>
  <div id="status-menu" class="menu hidden" role="menu">
    <button type="button" data-status="online"><span class="dot online"></span>Online</button>
    <button type="button" data-status="away"><span class="dot away"></span>Away</button>
    <button type="button" data-status="busy"><span class="dot busy"></span>Busy <small>do not disturb</small></button>
    <button type="button" data-status="invisible"><span class="dot offline"></span>Invisible <small>appear offline</small></button>
    <hr><button type="button" data-status-text>Set a status message…</button>
    <button type="button" data-profile>Edit profile…</button>
    <button type="button" data-appearance>Appearance…</button>
    <button type="button" data-devices>Devices…</button>
    <button type="button" data-sound>Sound…</button>
  </div>
  <input type="file" id="attach-file" class="hidden">
  <div id="lightbox" class="lightbox hidden" title="Click to close"><img id="lightbox-img" alt=""></div>
  <input type="file" id="avatar-file" accept="image/png,image/jpeg,image/gif,image/webp" class="hidden">
  <input type="file" id="icon-file" accept="image/png,image/jpeg,image/gif,image/webp" class="hidden">
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="picker" class="picker hidden" role="dialog" aria-label="Emoji">
    <input id="picker-search" placeholder="Search emoji" autocomplete="off" spellcheck="false">
    <div id="picker-tabs" class="picker-tabs"></div>
    <div id="picker-grid" class="picker-grid"></div>
  </div>
  <script src="emoji.js"></script>
  <script src="app.js"></script>
</body>
</html>
