# Lodestone Comms behind a reverse proxy you already run (Zoraxy, Traefik, Nginx Proxy Manager, Caddy),
# for example: Cloudflare Tunnel -> Zoraxy -> Comms.
#
#   1. Copy this folder to the server and create a .env next to this file:
#        COMMS_DOMAIN=comms.yourdomain.com
#   2. docker compose -f compose.proxy.yml up -d --build      (or podman-compose)
#   3. Read the one-time setup code:  docker compose -f compose.proxy.yml logs comms
#   4. In your proxy, send https://comms.yourdomain.com to this container (see below).
#
# Comms listens on plain HTTP; the proxy (and Cloudflare) provide HTTPS. COMMS_PUBLIC_URL must be the
# exact address people use: it's part of every signed sign-in and every invite link.
services:
  comms:
    build: .
    restart: unless-stopped
    environment:
      COMMS_PUBLIC_URL: https://${COMMS_DOMAIN:?set COMMS_DOMAIN in .env}
      # COMMS_ADMIN_ONLY_SPACES: "true"   # only host admins may create servers
    volumes:
      - comms-data:/data
    # Option A (default): reachable on the server itself at 127.0.0.1:${COMMS_PORT:-8095}.
    # Use this when Zoraxy runs on the host, or in Docker with network_mode: host.
    ports:
      - "127.0.0.1:${COMMS_PORT:-8095}:8080"
    # Option B: Zoraxy runs in Docker on its own network. Comment out `ports` above, uncomment both
    # `networks` blocks, set the network name, and point Zoraxy at http://lodestone-comms:8080.
    # networks:
    #   - proxy
    container_name: lodestone-comms
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  comms-data:

# networks:
#   proxy:
#     external: true
#     name: zoraxy_default   # the network your Zoraxy container is on (docker network ls)
