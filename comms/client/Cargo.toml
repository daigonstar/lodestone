[package]
name = "lodestone-comms-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lodestone Comms client core: device identity, end-to-end encryption (MLS) and the host connection"

[dependencies]
openmls = "0.9.2"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_memory_storage = "0.6.0"
openmls_traits = "0.6.0"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.43", features = ["bundled"] }

[dev-dependencies]
lodestone-comms-server = { path = "../server" }
tempfile = "3"
