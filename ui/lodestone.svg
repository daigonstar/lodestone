<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1840"/>
      <stop offset="0.55" stop-color="#11132a"/>
      <stop offset="1" stop-color="#0a0b14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7c5cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8a6ff"/>
      <stop offset="1" stop-color="#8a6cff"/>
    </linearGradient>
    <linearGradient id="fLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4b2fd6"/>
    </linearGradient>
    <linearGradient id="fRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd4ff"/>
      <stop offset="1" stop-color="#2a8fe0"/>
    </linearGradient>
    <linearGradient id="fBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a24b8"/>
      <stop offset="1" stop-color="#1d6fc4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50c8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fd8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="222.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="512" cy="520" r="360" fill="url(#glow)"/>

  <!-- magnetic field lines -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="512" cy="520" rx="330" ry="150" stroke="url(#ring)" stroke-width="10" transform="rotate(-24 512 520)"/>
    <ellipse cx="512" cy="520" rx="380" ry="200" stroke="url(#ring)" stroke-width="6" stroke-opacity="0.55" transform="rotate(-24 512 520)"/>
  </g>

  <!-- game tiles being pulled in -->
  <g>
    <rect x="148" y="214" width="96" height="128" rx="18" fill="#66c0f4" transform="rotate(-18 196 278)"/>
    <rect x="148" y="214" width="96" height="128" rx="18" fill="#ffffff" fill-opacity="0.18" transform="rotate(-18 196 278)"/>
    <rect x="786" y="650" width="84" height="112" rx="16" fill="#b26bff" transform="rotate(16 828 706)"/>
    <rect x="742" y="182" width="66" height="88" rx="13" fill="#e9ecf2" fill-opacity="0.92" transform="rotate(14 775 226)"/>
  </g>

  <!-- the lodestone: a faceted crystal -->
  <g>
    <polygon points="512,250 700,400 640,720 384,720 324,400" fill="#000" opacity="0.35" filter="url(#soft)" transform="translate(0 18)"/>
    <polygon points="512,250 700,400 512,450 324,400" fill="url(#fTop)"/>
    <polygon points="324,400 512,450 384,720" fill="url(#fLeft)"/>
    <polygon points="700,400 640,720 512,450" fill="url(#fRight)"/>
    <polygon points="512,450 640,720 384,720" fill="url(#fBottom)"/>
    <polyline points="324,400 512,450 700,400" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="512,250 700,400 640,720 384,720 324,400" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="512,268 600,338 512,362 424,338" fill="#ffffff" fill-opacity="0.28"/>
    <!-- play -->
    <path d="M478 520 L478 640 L578 580 Z" fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round"/>
  </g>
</svg>
