<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d3a"/><stop offset="1" stop-color="#14151c"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9733f"/><stop offset="1" stop-color="#a8452a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e2531f"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity=".55"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <circle cx="128" cy="150" r="110" fill="url(#halo)" clip-path="url(#tile)"/>
  <!-- chimney -->
  <rect x="150" y="34" width="26" height="46" rx="4" fill="#8a3a24"/>
  <rect x="146" y="30" width="34" height="10" rx="3" fill="#c25a33"/>
  <!-- beehive kiln dome -->
  <path d="M40 206 V150 A88 88 0 0 1 216 150 V206 Z" fill="url(#brick)" stroke="#5c2414" stroke-width="6" stroke-linejoin="round"/>
  <!-- brick courses -->
  <g stroke="#7d2f1b" stroke-width="4" fill="none" stroke-linecap="round" opacity=".75">
    <path d="M52 118 Q128 96 204 118"/>
    <path d="M42 150 H214"/>
    <path d="M42 180 H214"/>
    <path d="M128 98 V118 M90 122 V150 M166 122 V150 M70 150 V180 M186 150 V180"/>
  </g>
  <!-- firing mouth -->
  <path d="M86 206 V170 A42 42 0 0 1 170 170 V206 Z" fill="url(#glow)" stroke="#5c2414" stroke-width="6" stroke-linejoin="round"/>
  <!-- flame -->
  <path d="M128 202 C104 196 102 176 114 160 C116 172 122 174 124 168 C122 152 132 140 140 134 C138 150 156 160 152 180 C150 194 140 202 128 202 Z" fill="#fff6d6" opacity=".95"/>
  <!-- base -->
  <rect x="28" y="204" width="200" height="16" rx="6" fill="#3a1a12"/>
</svg>
