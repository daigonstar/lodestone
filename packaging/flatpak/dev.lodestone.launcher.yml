# Lodestone as a Flatpak. Build and install for your user with:
#   packaging/flatpak/build.sh
# Games, Steam, umu-run and the store clients keep running on the host: Lodestone starts them through
# `flatpak-spawn --host` (see src-tauri/src/host.rs), so the app needs the host permissions below.
app-id: dev.lodestone.launcher
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lodestone
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Game folders on any drive, store clients' data and Wine prefixes.
  - --filesystem=host
  # Start games, Steam, umu-run and store clients on the host.
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: lodestone
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/lodestone/cargo
      # Crates are fetched during the build (a local build, not a Flathub one).
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/lodestone /app/bin/lodestone
      - install -Dm644 assets/lodestone.svg /app/share/icons/hicolor/scalable/apps/dev.lodestone.launcher.svg
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/dev.lodestone.launcher.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/dev.lodestone.launcher.png
      - install -Dm644 packaging/flatpak/dev.lodestone.launcher.desktop /app/share/applications/dev.lodestone.launcher.desktop
      - install -Dm644 packaging/flatpak/dev.lodestone.launcher.metainfo.xml /app/share/metainfo/dev.lodestone.launcher.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - src-tauri/target
          - packaging/flatpak/.flatpak-builder
          - packaging/flatpak/build-dir
          - packaging/flatpak/repo
          - .git
