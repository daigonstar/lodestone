# Runs on every push and pull request:
#   - network: fails if the code mentions a web address that isn't in network-hosts.txt
#   - audit:   fails on Rust dependencies with known security advisories (RustSec database)
#   - test:    builds Lodestone and runs its tests
name: Checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every web address is listed in network-hosts.txt
        run: python3 scripts/check-network.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Known vulnerabilities in dependencies
        working-directory: src-tauri
        run: cargo audit

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build and test
        working-directory: src-tauri
        run: cargo test --release --locked
